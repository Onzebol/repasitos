name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # Para revisar la PR sin publicar: descargar el artefacto y abrirlo con `npx vite preview`
      - uses: actions/upload-artifact@v7
        with:
          name: dist-pr-${{ github.event.pull_request.number || 'manual' }}
          path: dist
          retention-days: 7
